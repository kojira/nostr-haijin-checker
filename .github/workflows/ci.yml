name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Verify Node runtime
        run: node --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run web:typecheck
      - run: npm test
      - run: npm run build
      - run: npm run web:build
